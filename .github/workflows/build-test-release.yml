name: Build, test, release

on:
    push:
        branches:
            - main

permissions: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    select-mode:
        name: Select mode
        runs-on: ubuntu-latest
        outputs:
            mode: ${{ steps.select-mode.outputs.mode }}
            publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
        permissions:
            contents: read
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Select Changesets mode
              id: select-mode
              uses: changesets/action/select-mode@v2

    version:
        name: Version packages
        if: needs.select-mode.outputs.mode == 'version'
        needs: select-mode
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Create or update Version Packages PR
              uses: changesets/action/version@v2
              with:
                  script: pnpm run version

    pack:
        name: Build, test and pack
        if: needs.select-mode.outputs.mode == 'publish'
        needs: select-mode
        runs-on: ubuntu-latest
        outputs:
            pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
        permissions:
            contents: read
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Run Tests
              run: pnpm test

            - name: Pack packages
              id: pack
              uses: changesets/action/pack@v2
              with:
                  publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

    publish:
        name: Publish to npm
        needs: pack
        runs-on: ubuntu-latest
        outputs:
            published: ${{ steps.publish.outputs.published }}
            published-packages: ${{ steps.publish.outputs.published-packages }}
        permissions:
            contents: write
            id-token: write
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            - name: Ensure npm supports trusted publishing
              run: |
                  if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
                      npm install --global npm@^11.5.1
                  fi
                  npm --version

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Publish packages
              id: publish
              uses: changesets/action/publish@v2
              with:
                  pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

    deploy:
        name: Deploy CDN and notify
        needs: publish
        if: needs.publish.outputs.published == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            PUBLISHED_PACKAGES: ${{ needs.publish.outputs.published-packages }}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Deploy CDN build - browser-sdk
              if: contains(fromJSON(env.PUBLISHED_PACKAGES).*.name, '@whereby.com/browser-sdk')
              uses: ./.github/actions/deploy-cdn
              with:
                  aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  package: "browser-sdk"
                  dest_dir: "embed"

            - name: Deploy CDN assets - camera-effects
              if: contains(fromJSON(env.PUBLISHED_PACKAGES).*.name, '@whereby.com/camera-effects')
              uses: ./.github/actions/deploy-cdn
              with:
                  aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  package: "camera-effects"
                  dest_dir: "camera-effects"

            - name: Deploy CDN assets - audio-denoiser
              if: contains(fromJSON(env.PUBLISHED_PACKAGES).*.name, '@whereby.com/audio-denoiser')
              uses: ./.github/actions/deploy-cdn
              with:
                  aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  package: "audio-denoiser"
                  dest_dir: "audio-denoiser"

            - name: Send Slack message
              uses: ./.github/actions/notify-slack
              with:
                  channel_id: ${{ vars.WHEREBY_DEPLOYMENT_SLACK_CHANNEL_ID }}
                  slack_bot_token: ${{ secrets.WHEREBY_DEPLOYMENT_SLACK_BOT_TOKEN }}
                  published_packages: ${{ env.PUBLISHED_PACKAGES }}
