name: Canary

on:
    workflow_dispatch:
        inputs:
            pr:
                description: "Pull request number"
                required: true
                type: number

permissions: {}

concurrency: ${{ github.workflow }}-${{ inputs.pr }}

jobs:
    canary_release:
        name: Canary Release
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
            pull-requests: write
            id-token: write
        env:
            PR: ${{ inputs.pr }}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6

            - name: Checkout PR
              run: gh pr checkout "$PR"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Reset changeset files on changeset-release/main branch
              run: |
                  if [[ $(git branch --show-current) == "changeset-release/main" ]]; then
                      git fetch --depth=1 origin main
                      git checkout FETCH_HEAD -- .changeset
                  fi

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            - name: Ensure npm supports trusted publishing
              run: |
                  if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
                      npm install --global npm@^11.5.1
                  fi
                  npm --version

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Create and publish canary release
              uses: actions/github-script@v7
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  script: |
                      const fs = require('fs')
                      const path = require('path')

                      await exec.exec('pnpm', ['changeset', 'version', '--snapshot', 'canary'])
                      await exec.exec('pnpm', ['run', 'release', '--tag', 'canary', '--no-git-tag'])

                      const newTags = fs.readdirSync('packages')
                        .map(dir => path.join('packages', dir, 'package.json'))
                        .filter(file => fs.existsSync(file))
                        .map(file => JSON.parse(fs.readFileSync(file, 'utf8')))
                        .filter(pkg => !pkg.private && pkg.version.includes('-canary-'))
                        .map(pkg => `${pkg.name}@${pkg.version}`)

                      if (newTags.length) {
                        const multiple = newTags.length > 1

                        const body = (
                          `🚀 **The canary release${multiple ? 's have' : ' has'} been published to npm.**\n\n` +
                          `You can test the release${multiple ? 's' : ''} by installing the ` +
                          `newly published version${multiple ? 's' : ''}:\n` +
                          newTags.map(tag => (
                            '```sh\n' +
                            `pnpm add ${tag}\n` +
                            '```'
                          )).join('\n')
                        )
                        await core.summary.addRaw(body).write()
                        await github.rest.issues.createComment({
                          issue_number: Number(process.env.PR),
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          body,
                        })
                      }

            - name: Deploy CDN assets - camera-effects
              uses: ./.github/actions/deploy-cdn
              with:
                  aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  package: "camera-effects"
                  dest_dir: "camera-effects"

            - name: Deploy CDN assets - audio-denoiser
              uses: ./.github/actions/deploy-cdn
              with:
                  aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  package: "audio-denoiser"
                  dest_dir: "audio-denoiser"
